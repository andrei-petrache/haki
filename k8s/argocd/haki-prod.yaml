# The ArgoCD Application for prod: k8s/overlays/prod at one fixed commit of
# main, synced into haki. Unlike staging it never follows main: targetRevision
# is a full commit SHA, and only a promotion moves it (k8s/README.md, "Prod
# through ArgoCD"), so a change merged to main reaches prod only once it is
# promoted. Applied from main by the Application haki-apps; checked on every
# pull request by prod-guard (scripts/check-prod-app.sh), from main's copy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haki-prod
  namespace: argocd
  annotations:
    # Compare through a server-side dry run, as for staging: the defaults the
    # API server fills in do not show as drift
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    # Never pruned or deleted by haki-apps, even if this file left main or a
    # sync with prune ran
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  # No finalizers: deleting this Application never deletes what it deployed.
  # Beware: `argocd app delete` and the UI delete in cascade by default.
spec:
  project: haki-prod
  source:
    repoURL: https://github.com/andrei-petrache/haki.git
    # The commit whose prod overlay renders exactly what ran in haki when
    # ArgoCD took it over (kubectl diff -k k8s/overlays/prod was empty)
    targetRevision: c0d2f07e7d46f44adacb80f54ac0ec2fe810740f
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: haki
  syncPolicy:
    # No automated sync yet: the takeover is done by hand first (diff, then
    # a manual sync without prune), as for staging in S8
    syncOptions:
      # Delete what left Git only at the end, once every wave is healthy
      - PruneLast=true
    # No automatic retry of a failed sync: each retry would run a fresh
    # migration Job, and the previous one's logs would go
    retry:
      limit: 0
