# The ArgoCD project for Haki prod: what its one Application may deploy, and
# where. Separate from the staging project (haki), so an Application of one
# can never deploy into the other. A whitelist: whatever is not listed is
# refused. Applied by hand (see k8s/README.md, "Prod through ArgoCD").
#   kubectl apply -f k8s/argocd/project-prod.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: haki-prod
  namespace: argocd
  # No finalizers: nothing here may delete resources in cascade
spec:
  description: Haki prod, deployed from this repository only
  # Public repository: no credentials, no repository Secret
  sourceRepos:
    - https://github.com/andrei-petrache/haki.git
  # Only the prod namespace of this cluster
  destinations:
    - server: https://kubernetes.default.svc
      namespace: haki
  # Cluster-scoped: only the prod Namespace itself, by name
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: haki
  # Namespaced: only the kinds k8s/overlays/prod renders, as for staging. No
  # Secret and no PersistentVolumeClaim: ArgoCD can neither create, change
  # nor delete the secrets or the database volume. Pod and ReplicaSet only so
  # the UI shows the pods: Git holds none, so ArgoCD has nothing to do with
  # them.
  namespaceResourceWhitelist:
    - { group: "", kind: ConfigMap }
    - { group: "", kind: Service }
    - { group: "", kind: Pod }
    - { group: apps, kind: Deployment }
    - { group: apps, kind: ReplicaSet }
    - { group: apps, kind: StatefulSet }
    - { group: batch, kind: Job }
    - { group: gateway.networking.k8s.io, kind: Gateway }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute }
    - { group: gateway.envoyproxy.io, kind: EnvoyProxy }
    - { group: gateway.envoyproxy.io, kind: ClientTrafficPolicy }
