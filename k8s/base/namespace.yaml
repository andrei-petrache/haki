# Every Haki resource lives in this namespace, apart from anything else in
# the cluster. Each overlay renames it to its own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: haki
  annotations:
    # ArgoCD (staging): first wave, with the ConfigMaps. Never pruned and
    # never deleted with the Application: deleting the namespace would delete
    # the database volume and the Secret inside it.
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: haki
    # Applied first, with the ConfigMaps (see k8s/README.md)
    haki/phase: config
