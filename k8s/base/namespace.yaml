# Every Haki resource lives in this namespace, apart from anything else in
# the cluster. Each overlay renames it to its own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: haki
  labels:
    app.kubernetes.io/part-of: haki
    # Applied first, with the ConfigMaps (see k8s/README.md)
    haki/phase: config
