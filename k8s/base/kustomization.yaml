# The Haki resources shared by every environment. Not applied on its own:
# an overlay (k8s/overlays/*) sets the namespace and the app image tags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: haki

resources:
  - namespace.yaml
  - postgres.yaml
  - migrate-job.yaml
  - backend.yaml
  - frontend.yaml
  - gateway.yaml

# Non-secret settings, one ConfigMap per component. Kustomize appends a hash
# of the contents to each name and updates the references, so a change
# restarts only the pods that read that ConfigMap. Secrets (DB_USER,
# DB_PASSWORD, JWT_SECRET_KEY) live in the Secret haki-secrets, created by
# hand with kubectl and never committed.
# The label haki/phase=config lets these be applied before everything else
# (see k8s/README.md); for ArgoCD (staging), the annotation puts them in the
# first sync wave, with the namespace. Annotations do not change the hash in
# the names, so adding them restarts nothing.
configMapGenerator:
  # Read by PostgreSQL. The name is used only when the data directory is
  # created; it is copied from haki-backend-config below.
  - name: haki-db-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: haki
        haki/phase: config
    literals:
      - DB_NAME=placeholder
  # Read by the backend and the migration Job
  - name: haki-backend-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: haki
        haki/phase: config
    literals:
      # The database Service (postgres.yaml), in the same namespace
      - DB_HOST=haki-db
      - DB_PORT=5432
      - DB_NAME=haki
  # Read by the frontend's Nginx. BACKEND_URL names the backend Service in
  # the overlay's own namespace, so each overlay sets it.
  - name: haki-frontend-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: haki
        haki/phase: config
    literals:
      # Whose X-Forwarded-For Nginx trusts for the client IP: the pod CIDR
      # of the kind cluster, where the Envoy Gateway proxy runs
      - REAL_IP_FROM=10.244.0.0/16

# The database name has one source: haki-backend-config
replacements:
  - source:
      kind: ConfigMap
      name: haki-backend-config
      fieldPath: data.DB_NAME
    targets:
      - select:
          kind: ConfigMap
          name: haki-db-config
        fieldPaths:
          - data.DB_NAME

images:
  # Must match services.db.image in compose.yaml, the single source of truth
  # for the PostgreSQL pin; CI's manifests job checks that they match
  - name: postgres
    newTag: 18.6-trixie
