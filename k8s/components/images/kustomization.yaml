# The app images, pinned once for every overlay that includes this component
# (staging and prod: prod gets them at the commit it is promoted to). The
# images CI built, scanned and published for one commit of
# main. The migration Job runs the backend image under its own name, with the
# backend's tag; only an active rollback-pin.yaml next to this file lets the
# two differ (CI checks both). newTag stays on the line right under each name:
# scripts/set-staging-tags.sh relies on it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

images:
  - name: ghcr.io/andrei-petrache/haki-backend
    newTag: "94b2f91a37b66bad1b95ce2d444e4289634c6aab"
  - name: ghcr.io/andrei-petrache/haki-frontend
    newTag: "94b2f91a37b66bad1b95ce2d444e4289634c6aab"
  - name: haki-migrate
    newTag: "94b2f91a37b66bad1b95ce2d444e4289634c6aab"
    newName: ghcr.io/andrei-petrache/haki-backend
