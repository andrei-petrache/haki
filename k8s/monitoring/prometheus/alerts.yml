# Alert rules for staging, evaluated by Prometheus every 30 s. They show as
# pending, then firing, in Prometheus (Alerts) and in Grafana; nothing sends
# them anywhere yet: an Alertmanager needs an e-mail or chat service.
# Tested by alerts.test.yml:
#   promtool test rules k8s/monitoring/prometheus/alerts.test.yml
groups:
  - name: haki-staging
    rules:
      # More than 5% of the API's responses are 5xx for 10 minutes, with at
      # least a little traffic (above about one request a minute), so a
      # single failed request on a quiet staging does not page
      - alert: HakiStagingApi5xx
        expr: |
          (
            sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/haki-staging/haki/rule/0", envoy_response_code_class="5"}[5m]))
            /
            sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/haki-staging/haki/rule/0"}[5m]))
          ) > 0.05
          and
          sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/haki-staging/haki/rule/0"}[5m])) > 0.02
        for: 10m
        labels:
          severity: warning
          namespace: haki-staging
        annotations:
          summary: Staging's API answers 5xx to more than 5% of requests
          description: For 10 minutes, more than 5% of the requests on the /api route got a 5xx (backend down, database unreachable or a bug). Dashboard Backend (staging).

      # A container that keeps restarting: 3 restarts in 15 minutes, or
      # waiting in CrashLoopBackOff, for 5 minutes
      - alert: HakiStagingPodRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="haki-staging"}[15m]) >= 3
          or
          kube_pod_container_status_waiting_reason{namespace="haki-staging", reason="CrashLoopBackOff"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} is in a restart loop"
          description: "Container {{ $labels.container }} of {{ $labels.pod }} keeps restarting. kubectl -n haki-staging describe pod {{ $labels.pod }}; dashboard Pods (staging)."

      # A container that has waited on its image for 5 minutes: the tag in
      # Git names an image GHCR does not have (a publish that pushed one image
      # and not the other, as haki-frontend:3666079 once did, or a deleted
      # package), or GHCR cannot be reached. ErrImagePull and ImagePullBackOff
      # take turns, so the reasons are merged per container before the 5
      # minutes are counted; init containers count too
      - alert: HakiStagingImagePullFailing
        expr: |
          max by (namespace, pod, container) (
            {__name__=~"kube_pod_(init_)?container_status_waiting_reason", namespace="haki-staging", reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName"}
          ) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} cannot pull its image"
          description: "Container {{ $labels.container }} of {{ $labels.pod }} has waited on its image for 5 minutes. Check that the tag in k8s/components/images exists on GHCR (the publish job's log names each push). kubectl -n haki-staging describe pod {{ $labels.pod }}."

      # A Job that failed: the migration hook (the sync stops there, the
      # previous version keeps running) or the catalog import (PostSync: the
      # deploy goes on and the catalog stays as it was). The failed Job stays
      # until the next sync replaces it (BeforeHookCreation), so this fires
      # until then
      - alert: HakiStagingJobFailed
        expr: kube_job_failed{namespace="haki-staging", condition="true"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.job_name }} failed"
          description: "Job {{ $labels.job_name }} in haki-staging failed. kubectl -n haki-staging logs job/{{ $labels.job_name }}; the import's exit code says why (k8s/README.md)."

      # A scrape target that answers nothing for 5 minutes: without it every
      # alert that reads its metrics stays silent, whatever happens
      - alert: HakiScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} has answered nothing for 5 minutes, so the alerts that read it cannot fire. Prometheus, Status, Targets."

      # No staging backend to scrape at all for 10 minutes: its targets come
      # from Running pods only, so a backend that is gone shows no target
      # instead of a target that is down
      - alert: HakiStagingBackendMetricsMissing
        expr: absent(up{job="backend-staging"} == 1)
        for: 10m
        labels:
          severity: warning
          namespace: haki-staging
        annotations:
          summary: No staging backend has been scraped for 10 minutes
          description: "No Running staging backend pod served its metrics on port 9000 for 10 minutes. kubectl -n haki-staging get pods; dashboard Backend (staging)."

      # A container above 90% of its memory limit for 15 minutes is the next
      # OOM kill; Grafana's first version (#113) went into an OOM loop that
      # only a person looking saw
      - alert: HakiMemoryNearLimit
        expr: |
          max by (namespace, pod, container) (
            container_memory_working_set_bytes{namespace=~"haki-staging|monitoring", container!=""}
          )
          /
          max by (namespace, pod, container) (
            kube_pod_container_resource_limits{namespace=~"haki-staging|monitoring", resource="memory"}
          ) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit"
          description: "Container {{ $labels.container }} of {{ $labels.pod }} has been above 90% of its memory limit for 15 minutes; past the limit the kernel kills it. Dashboard Pods (staging)."

      # A container restarted after an OOM kill, even once
      - alert: HakiContainerOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace=~"haki-staging|monitoring"}[10m]) > 0
          and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{namespace=~"haki-staging|monitoring", reason="OOMKilled"} == 1
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} was killed for using too much memory"
          description: "Container {{ $labels.container }} of {{ $labels.pod }} restarted after an OOM kill in the last 10 minutes: raise its memory limit or find what grew. kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}."
