# Unit tests for alerts.yml (promtool test rules). Series advance every 30 s.
rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - name: sustained 5xx on the API fires after 10 minutes
    interval: 30s
    input_series:
      # 1 request a second, 20% of them 5xx
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/haki-staging/haki/rule/0"}'
        values: "0+30x80"
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/haki-staging/haki/rule/0", envoy_response_code_class="5"}'
        values: "0+6x80"
    alert_rule_test:
      - eval_time: 8m
        alertname: HakiStagingApi5xx
        exp_alerts: []
      - eval_time: 20m
        alertname: HakiStagingApi5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: haki-staging
            exp_annotations:
              summary: Staging's API answers 5xx to more than 5% of requests
              description: For 10 minutes, more than 5% of the requests on the /api route got a 5xx (backend down, database unreachable or a bug). Dashboard Backend (staging).

  - name: a 5xx share under 5% stays quiet
    interval: 30s
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/haki-staging/haki/rule/0"}'
        values: "0+30x80"
      # 2%
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/haki-staging/haki/rule/0", envoy_response_code_class="5"}'
        values: "0+0.6x80"
    alert_rule_test:
      - eval_time: 30m
        alertname: HakiStagingApi5xx
        exp_alerts: []

  - name: a quiet staging where every rare request fails stays quiet
    interval: 30s
    input_series:
      # One request every 5 minutes, all 5xx: below the traffic floor
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/haki-staging/haki/rule/0"}'
        values: "0+0.1x80"
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/haki-staging/haki/rule/0", envoy_response_code_class="5"}'
        values: "0+0.1x80"
    alert_rule_test:
      - eval_time: 30m
        alertname: HakiStagingApi5xx
        exp_alerts: []

  - name: 5xx on the static files (rule 1) do not count for the API
    interval: 30s
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/haki-staging/haki/rule/1"}'
        values: "0+30x80"
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/haki-staging/haki/rule/1", envoy_response_code_class="5"}'
        values: "0+30x80"
    alert_rule_test:
      - eval_time: 30m
        alertname: HakiStagingApi5xx
        exp_alerts: []

  - name: three restarts in 15 minutes fire after 5 minutes
    interval: 30s
    input_series:
      # One restart every 4 minutes
      - series: 'kube_pod_container_status_restarts_total{namespace="haki-staging", pod="haki-backend-abc", container="backend"}'
        values: "0+0.125x80"
    alert_rule_test:
      - eval_time: 25m
        alertname: HakiStagingPodRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: haki-staging
              pod: haki-backend-abc
              container: backend
            exp_annotations:
              summary: haki-backend-abc is in a restart loop
              description: "Container backend of haki-backend-abc keeps restarting. kubectl -n haki-staging describe pod haki-backend-abc; dashboard Pods (staging)."

  - name: CrashLoopBackOff for 5 minutes fires
    interval: 30s
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="haki-staging", pod="haki-db-0", container="postgres", reason="CrashLoopBackOff"}'
        values: "0x2 1x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: HakiStagingPodRestartLoop
        exp_alerts: []
      - eval_time: 9m
        alertname: HakiStagingPodRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: haki-staging
              pod: haki-db-0
              container: postgres
              reason: CrashLoopBackOff
            exp_annotations:
              summary: haki-db-0 is in a restart loop
              description: "Container postgres of haki-db-0 keeps restarting. kubectl -n haki-staging describe pod haki-db-0; dashboard Pods (staging)."

  - name: one restart stays quiet, and prod is not watched
    interval: 30s
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="haki-staging", pod="haki-frontend-abc", container="frontend"}'
        values: "0x10 1x70"
      - series: 'kube_pod_container_status_restarts_total{namespace="haki", pod="haki-backend-prod", container="backend"}'
        values: "0+0.5x80"
    alert_rule_test:
      - eval_time: 30m
        alertname: HakiStagingPodRestartLoop
        exp_alerts: []

  - name: an image that cannot be pulled fires after 5 minutes, across ErrImagePull and ImagePullBackOff
    interval: 30s
    input_series:
      # The two reasons take turns every 30 s, as the kubelet's back-off does
      - series: 'kube_pod_container_status_waiting_reason{namespace="haki-staging", pod="haki-frontend-abc", container="frontend", reason="ErrImagePull"}'
        values: "1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _"
      - series: 'kube_pod_container_status_waiting_reason{namespace="haki-staging", pod="haki-frontend-abc", container="frontend", reason="ImagePullBackOff"}'
        values: "_ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1"
    alert_rule_test:
      - eval_time: 4m
        alertname: HakiStagingImagePullFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: HakiStagingImagePullFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: haki-staging
              pod: haki-frontend-abc
              container: frontend
            exp_annotations:
              summary: haki-frontend-abc cannot pull its image
              description: "Container frontend of haki-frontend-abc has waited on its image for 5 minutes. Check that the tag in k8s/components/images exists on GHCR (the publish job's log names each push). kubectl -n haki-staging describe pod haki-frontend-abc."

  - name: an init container that cannot pull its image fires too
    interval: 30s
    input_series:
      - series: 'kube_pod_init_container_status_waiting_reason{namespace="haki-staging", pod="haki-backend-abc", container="wait-for-db", reason="ImagePullBackOff"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: HakiStagingImagePullFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: haki-staging
              pod: haki-backend-abc
              container: wait-for-db
            exp_annotations:
              summary: haki-backend-abc cannot pull its image
              description: "Container wait-for-db of haki-backend-abc has waited on its image for 5 minutes. Check that the tag in k8s/components/images exists on GHCR (the publish job's log names each push). kubectl -n haki-staging describe pod haki-backend-abc."

  - name: a short pull, other waiting reasons and prod stay quiet
    interval: 30s
    input_series:
      # 2 minutes of ImagePullBackOff, then the image arrives
      - series: 'kube_pod_container_status_waiting_reason{namespace="haki-staging", pod="haki-backend-abc", container="backend", reason="ImagePullBackOff"}'
        values: "1x4 _x20"
      - series: 'kube_pod_container_status_waiting_reason{namespace="haki-staging", pod="haki-backend-def", container="backend", reason="ContainerCreating"}'
        values: "1x30"
      - series: 'kube_pod_container_status_waiting_reason{namespace="haki", pod="haki-backend-prod", container="backend", reason="ImagePullBackOff"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: HakiStagingImagePullFailing
        exp_alerts: []

  - name: a failed Job fires after a minute
    interval: 30s
    input_series:
      - series: 'kube_job_failed{namespace="haki-staging", job_name="haki-catalog-import", condition="true"}'
        values: "0 1x10"
      - series: 'kube_job_failed{namespace="haki-staging", job_name="haki-catalog-import", condition="false"}'
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: HakiStagingJobFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: HakiStagingJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: haki-staging
              job_name: haki-catalog-import
              condition: "true"
            exp_annotations:
              summary: Job haki-catalog-import failed
              description: "Job haki-catalog-import in haki-staging failed. kubectl -n haki-staging logs job/haki-catalog-import; the import's exit code says why (k8s/README.md)."

  - name: completed Jobs and prod's Jobs stay quiet
    interval: 30s
    input_series:
      - series: 'kube_job_complete{namespace="haki-staging", job_name="haki-migrate", condition="true"}'
        values: "1x10"
      - series: 'kube_job_failed{namespace="haki", job_name="haki-migrate", condition="true"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: HakiStagingJobFailed
        exp_alerts: []

  - name: a target that answers nothing fires after 5 minutes
    interval: 30s
    input_series:
      - series: 'up{job="envoy-staging", instance="10.244.0.5:19001", pod="envoy-abc"}'
        values: "1x4 0x30"
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics.monitoring.svc:8080"}'
        values: "1x34"
    alert_rule_test:
      - eval_time: 5m
        alertname: HakiScrapeTargetDown
        exp_alerts: []
      - eval_time: 10m
        alertname: HakiScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: envoy-staging
              instance: 10.244.0.5:19001
              pod: envoy-abc
            exp_annotations:
              summary: Prometheus cannot scrape envoy-staging
              description: "Target 10.244.0.5:19001 of job envoy-staging has answered nothing for 5 minutes, so the alerts that read it cannot fire. Prometheus, Status, Targets."

  - name: no staging backend to scrape fires after 10 minutes, a scraped one stays quiet
    interval: 30s
    input_series:
      # The only backend pod goes away after 2 minutes: its series ends
      - series: 'up{job="backend-staging", instance="10.244.0.34:9000", pod="haki-backend-abc"}'
        values: "1x4"
    alert_rule_test:
      - eval_time: 4m
        alertname: HakiStagingBackendMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: HakiStagingBackendMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: haki-staging
            exp_annotations:
              summary: No staging backend has been scraped for 10 minutes
              description: "No Running staging backend pod served its metrics on port 9000 for 10 minutes. kubectl -n haki-staging get pods; dashboard Backend (staging)."

  - name: a backend that is scraped keeps the missing-metrics alert quiet
    interval: 30s
    input_series:
      - series: 'up{job="backend-staging", instance="10.244.0.34:9000", pod="haki-backend-abc"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: HakiStagingBackendMetricsMissing
        exp_alerts: []

  - name: memory above 90% of the limit fires after 15 minutes
    interval: 30s
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="monitoring", pod="grafana-abc", container="grafana", id="/x"}'
        values: "380000000x50"
      - series: 'kube_pod_container_resource_limits{namespace="monitoring", pod="grafana-abc", container="grafana", resource="memory", unit="byte"}'
        values: "400000000x50"
    alert_rule_test:
      - eval_time: 10m
        alertname: HakiMemoryNearLimit
        exp_alerts: []
      - eval_time: 20m
        alertname: HakiMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              pod: grafana-abc
              container: grafana
            exp_annotations:
              summary: grafana-abc uses 95% of its memory limit
              description: "Container grafana of grafana-abc has been above 90% of its memory limit for 15 minutes; past the limit the kernel kills it. Dashboard Pods (staging)."

  - name: memory at 76% of the limit, a CPU limit and prod stay quiet
    interval: 30s
    input_series:
      # Grafana's real share on 12 November 2026
      - series: 'container_memory_working_set_bytes{namespace="monitoring", pod="grafana-abc", container="grafana"}'
        values: "304000000x50"
      - series: 'kube_pod_container_resource_limits{namespace="monitoring", pod="grafana-abc", container="grafana", resource="memory", unit="byte"}'
        values: "400000000x50"
      - series: 'kube_pod_container_resource_limits{namespace="monitoring", pod="grafana-abc", container="grafana", resource="cpu", unit="core"}'
        values: "0.3x50"
      - series: 'container_memory_working_set_bytes{namespace="haki", pod="haki-backend-prod", container="backend"}'
        values: "390000000x50"
      - series: 'kube_pod_container_resource_limits{namespace="haki", pod="haki-backend-prod", container="backend", resource="memory", unit="byte"}'
        values: "400000000x50"
    alert_rule_test:
      - eval_time: 25m
        alertname: HakiMemoryNearLimit
        exp_alerts: []

  - name: a restart after an OOM kill fires at once
    interval: 30s
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="monitoring", pod="grafana-abc", container="grafana"}'
        values: "0x6 1x20"
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="monitoring", pod="grafana-abc", container="grafana", reason="OOMKilled"}'
        values: "0x6 1x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: HakiContainerOOMKilled
        exp_alerts: []
      - eval_time: 5m
        alertname: HakiContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              pod: grafana-abc
              container: grafana
            exp_annotations:
              summary: grafana-abc was killed for using too much memory
              description: "Container grafana of grafana-abc restarted after an OOM kill in the last 10 minutes: raise its memory limit or find what grew. kubectl -n monitoring describe pod grafana-abc."

  - name: a restart for another reason, and an old OOM kill, stay quiet
    interval: 30s
    input_series:
      # Restarted once at 3 minutes, after an error, not an OOM kill
      - series: 'kube_pod_container_status_restarts_total{namespace="haki-staging", pod="haki-backend-abc", container="backend"}'
        values: "0x6 1x40"
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="haki-staging", pod="haki-backend-abc", container="backend", reason="Error"}'
        values: "0x6 1x40"
      # Killed for memory long ago, no restart since
      - series: 'kube_pod_container_status_restarts_total{namespace="haki-staging", pod="haki-db-0", container="postgres"}'
        values: "1x46"
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="haki-staging", pod="haki-db-0", container="postgres", reason="OOMKilled"}'
        values: "1x46"
    alert_rule_test:
      - eval_time: 5m
        alertname: HakiContainerOOMKilled
        exp_alerts: []
      - eval_time: 20m
        alertname: HakiContainerOOMKilled
        exp_alerts: []
