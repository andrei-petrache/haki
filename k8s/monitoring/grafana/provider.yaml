# The dashboards in k8s/monitoring/grafana/dashboards, read-only: a change
# made in the UI cannot be saved; change the JSON file in Git instead
apiVersion: 1
providers:
  - name: haki
    folder: Haki staging
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
