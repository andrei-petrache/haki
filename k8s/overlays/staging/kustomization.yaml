# Staging: its own namespace (and so its own database) next to prod, with one
# backend replica. New image tags are tried here before prod.
#   kubectl apply -k k8s/overlays/staging  (in phases: see k8s/README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: haki-staging

resources:
  - ../../base

replicas:
  - name: haki-backend
    count: 1

# The only place staging's app images are pinned. The migration Job runs the
# backend image under its own name, with the backend's tag; only an active
# rollback-pin.yaml lets the two differ (CI checks both). newTag stays on the
# line right under each name: scripts/set-staging-tags.sh relies on it.
images:
  - name: ghcr.io/andrei-petrache/haki-backend
    newTag: "0ab4935bfa28765f8359d33b3d0c0d3496c31265"
  - name: ghcr.io/andrei-petrache/haki-frontend
    newTag: "0ab4935bfa28765f8359d33b3d0c0d3496c31265"
  - name: haki-migrate
    newTag: "0ab4935bfa28765f8359d33b3d0c0d3496c31265"
    newName: ghcr.io/andrei-petrache/haki-backend

configMapGenerator:
  # The backend Service in this namespace, by its full name: Nginx resolves
  # it itself and ignores resolv.conf's search domains. CI checks that the
  # namespace here is this overlay's.
  - name: haki-frontend-config
    behavior: merge
    literals:
      - BACKEND_URL=http://haki-backend.haki-staging.svc.cluster.local:8000
