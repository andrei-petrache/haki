# Staging: its own namespace (and so its own database) next to prod, with one
# backend replica. New image tags are tried here before prod.
#   kubectl apply -k k8s/overlays/staging  (in phases: see k8s/README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: haki-staging

resources:
  - ../../base

replicas:
  - name: haki-backend
    count: 1

# The app images come from the shared component, never from an images: list
# here (CI refuses one): the tags live in one place only.
components:
  - ../../components/images

# A rule of its own for /api, first, with the same destination as every
# other path (the frontend, whose Nginx proxies /api to the backend). Routing
# does not change; Envoy now counts the API's requests, response classes and
# latency apart from static files, as rule 0, which is what the monitoring
# dashboards read (the backend has no metrics of its own). Staging only.
patches:
  - target:
      kind: HTTPRoute
      name: haki
    patch: |-
      - op: add
        path: /spec/rules/0
        value:
          matches:
            - path:
                type: PathPrefix
                value: /api
          backendRefs:
            - name: haki-frontend
              port: 8080
  # Body weight and the adaptive target (phase 3) on staging only. Prod keeps
  # the default (off) until consent exists (phase 4); check-manifests.sh
  # refuses any *_ENABLED=true in the prod overlay. An image without the
  # setting ignores the variable.
  - target:
      kind: Deployment
      name: haki-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BODY_WEIGHT_ENABLED
          value: "true"
      # Which environment this is, as prod says it (check-manifests.sh)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENVIRONMENT
          value: staging

configMapGenerator:
  # The backend Service in this namespace, by its full name: Nginx resolves
  # it itself and ignores resolv.conf's search domains. CI checks that the
  # namespace here is this overlay's.
  - name: haki-frontend-config
    behavior: merge
    literals:
      - BACKEND_URL=http://haki-backend.haki-staging.svc.cluster.local:8000
