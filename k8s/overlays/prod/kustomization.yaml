# Production: the namespace haki, as before Kustomize, so the existing
# database volume (PVC data-haki-db-0) is kept.
#   kubectl apply -k k8s/overlays/prod     (in phases: see k8s/README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: haki

resources:
  - ../../base

# The only place the app images are pinned: the images CI built, scanned and
# published for one commit of main. The migration Job runs the backend image
# under its own name, with the backend's tag; only an active rollback-pin.yaml
# lets the two differ (CI checks both).
images:
  - name: ghcr.io/andrei-petrache/haki-backend
    newTag: 081c5f21498071b536c23dcdb18d22aa213a5afe
  - name: ghcr.io/andrei-petrache/haki-frontend
    newTag: 081c5f21498071b536c23dcdb18d22aa213a5afe
  - name: haki-migrate
    newTag: 081c5f21498071b536c23dcdb18d22aa213a5afe
    newName: ghcr.io/andrei-petrache/haki-backend

configMapGenerator:
  # The backend Service in this namespace, by its full name: Nginx resolves
  # it itself and ignores resolv.conf's search domains. CI checks that the
  # namespace here is this overlay's.
  - name: haki-frontend-config
    behavior: merge
    literals:
      - BACKEND_URL=http://haki-backend.haki.svc.cluster.local:8000
