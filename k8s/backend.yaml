# The Haki API (FastAPI + uvicorn), reachable inside the cluster as
# http://haki-backend:8000; only the frontend's Nginx talks to it.
#   kubectl apply -f k8s/backend.yaml
# Apply it after the migration Job has completed (k8s/migrate-job.yaml).

apiVersion: v1
kind: Service
metadata:
  name: haki-backend
  namespace: haki
  labels:
    app.kubernetes.io/name: haki-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: haki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: haki-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haki-backend
  namespace: haki
  labels:
    app.kubernetes.io/name: haki-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: haki
spec:
  # Two replicas: the Service spreads requests over both. Each one bounds its
  # own password hashing, so the cluster-wide bound is 2 x 4 hashes.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: haki-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haki-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: haki
    spec:
      # The API never talks to the Kubernetes API
      automountServiceAccountToken: false
      # No HAKI_DB_PORT=tcp://... and similar variables for every Service:
      # the settings come only from the env below
      enableServiceLinks: false
      securityContext:
        # The image's haki user
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Same image as the migration Job: change both together
          image: ghcr.io/andrei-petrache/haki-backend:3feeb2d54f43b8fb999e7d90db8b81f48ecf40f9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: haki-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: haki-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: haki-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: haki-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haki-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: haki-secrets
                  key: JWT_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Sized from the hashing bound (review H1): at most 4 Argon2 hashes
          # of 64 MiB at once, about 256 MiB, plus the app itself.
          # No CPU limit: a limit throttles even when the node is idle.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
