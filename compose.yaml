# Two ways to use this file (see README.md):
#   docker compose up -d db          only PostgreSQL, for uvicorn + Vite on the host
#   docker compose up -d --build     the whole app on http://127.0.0.1:8080

# Shared by migrate and backend. The DATABASE_URL in .env points to localhost
# for host development; inside the compose network the database host is "db".
x-backend: &backend
  build: ./backend
  image: haki-backend:dev
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (python -c "import secrets; print(secrets.token_urlsafe(32))")}

services:
  db:
    image: postgres:18.6-trixie
    container_name: haki-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-off: applies database migrations, then exits (runs again on every `up`,
  # which is harmless: alembic does nothing when already at head)
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No curl in the image: Python's urllib fails on any non-2xx, e.g. 503
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped
    # No ports: only reachable inside the compose network, through the frontend

  frontend:
    build: ./frontend
    image: haki-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    # Checks Nginx itself, not the backend: a backend outage should not
    # mark the frontend unhealthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

volumes:
  db-data:
