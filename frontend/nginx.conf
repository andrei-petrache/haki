# Haki frontend server. Replaces the image's /etc/nginx/conf.d/default.conf,
# which the image includes inside its http { } block.

# Login and signup run Argon2 (64 MiB each, deliberately slow), so they are
# rate limited per client IP. Only POST counts: an empty key is never limited.
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
# 5 requests per minute per IP; 10 MB of state tracks ~160,000 addresses
limit_req_zone $auth_limit_key zone=auth:10m rate=5r/m;

# Retry-After only on 429 responses (an empty value sends no header)
map $status $retry_after {
    429     60;
    default "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/haki;
    index index.html;

    # Basic security headers. Kept at server level only: a location with its
    # own add_header would silently drop these, which is why caching below
    # uses "expires" instead of add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Retry-After $retry_after always;

    limit_req_status 429;
    limit_req_log_level warn;

    # Compress text responses (text/html is always included)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Proxy settings shared by both /api locations below (inherited, since
    # neither location sets its own proxy_set_header)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Same contract as the Vite dev proxy: /api/foods -> backend /foods.
    # The trailing slash in proxy_pass replaces the matched /api/ prefix.
    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # Login and signup: a burst of 5 at once, then one every 12 s, else 429.
    # A regex location wins over the /api/ prefix above.
    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=auth burst=5 nodelay;
        # proxy_pass cannot replace a path in a regex location: strip /api here
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend:8000;
    }

    # Vite names these files after a hash of their content: a new build gets
    # new names, so browsers may keep them for a year without asking again.
    location /assets/ {
        expires 1y;
        # A missing asset is a 404, not index.html served as JavaScript
        try_files $uri =404;
    }

    # index.html points to the current asset names, so browsers must check
    # for a new version every time (no-cache = revalidate, not "never store")
    location = /index.html {
        expires -1;
    }

    # Unknown paths get the app, ready for client-side routing later
    location / {
        try_files $uri $uri/ /index.html;
    }
}
