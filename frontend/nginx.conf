# Haki's main Nginx config, replacing the image's /etc/nginx/nginx.conf.
# Identical to the image's (nginx-unprivileged 1.30) except for
# worker_processes; the server itself is in nginx.conf.template. When the
# base image changes, compare with its own copy:
#   docker run --rm --entrypoint cat <base image> /etc/nginx/nginx.conf

# "auto" would start one worker per CPU of the machine, not per CPU the
# container may use: 16 on a 16-CPU node, all counted against the pod's
# memory limit. Two workers are plenty for the pod's CPU request. The
# image's NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE cannot help: it edits
# this file at start, and the root filesystem is read-only in Kubernetes.
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
# /tmp: the only writable place (an emptyDir in Kubernetes)
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
