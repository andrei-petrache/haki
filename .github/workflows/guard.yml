name: Guard

# The checks a pull request must not be able to weaken: what may reach prod
# (k8s/argocd/haki-prod.yaml) and what the tag bot's pull request may change
# (auto-merge relies on it).
#
# pull_request_target runs this file and the scripts as they are on main,
# never the pull request's version: a pull request that edits a rule is still
# checked by the old one, and the new rule takes effect only once merged.
# The pull request's commits are fetched as data and read with git and yq;
# nothing from them is checked out or run. No secrets, a read-only token, and
# no credentials kept in git: pull_request_target also runs for pull requests
# from forks.
#
# The pull request is judged against main as the event saw it (github.sha),
# the same commit the rules come from, never the event's
# pull_request.base.sha: that one can lag behind main. On #82, rewritten in
# place after #83 merged, it still said fdc9943 while main was df47b3c, so
# the promotion's one commit was counted together with #83's.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  # To read the pull request's commits (who made them, whether verified)
  pull-requests: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A required check: it runs on every pull request to main
  prod-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # main as it is now (pull_request_target's default), with its history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout takes main's tip when the job starts; github.sha is main's
      # tip when the event fired. If main moved in between, or this is "Re-run
      # jobs" (which keeps the old event), the rules and the base would be two
      # commits: refuse, and check the pull request again by closing and
      # reopening it (or by updating its branch)
      - name: Check that main did not move since the event
        run: |
          checked_out="$(git rev-parse HEAD)"
          echo "main checked out: $checked_out; event (github.sha): ${GITHUB_SHA:-none}"
          [ "$checked_out" = "${GITHUB_SHA:-}" ] \
            || { echo "::error::main moved since this event (checked out ${checked_out:0:7}, event ${GITHUB_SHA:0:7}): close and reopen the pull request to check it again; Re-run jobs reuses the old event"; exit 1; }

      # kustomize: check-promotion.sh renders prod's overlay at each revision
      - name: Install yq and kustomize
        run: |
          scripts/install-tools.sh "$RUNNER_TEMP/bin" yq kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Into the object store only: no checkout, the working tree stays main's.
      # The repository is public, so no credentials are needed.
      # GitHub can start this job before refs/pull/N/head exists: on #153,
      # opened seconds after its push, the fetch found no such ref. Only the
      # fetch is tried again, 3 times in all, 5 s then 10 s apart; if the ref
      # is still missing, the step fails. Tests: scripts/test-guard-fetch.sh
      - name: Fetch the pull request's commits, as data
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for try in 1 2 3; do
            if git fetch --no-tags -q origin "+refs/pull/$NUMBER/head:refs/remotes/pull/head"; then
              break
            fi
            if [ "$try" = 3 ]; then
              echo "::error::refs/pull/$NUMBER/head could not be fetched after 3 tries"
              exit 1
            fi
            echo "::warning::refs/pull/$NUMBER/head could not be fetched (try $try of 3); next try in $((try * 5)) s"
            sleep $((try * 5))
          done
          [ "$(git rev-parse refs/remotes/pull/head)" = "$HEAD_SHA" ] \
            || { echo "::error::The pull request moved while this ran; the next run checks it"; exit 1; }

      # Read through the API with the read-only token: who made each commit,
      # and whether GitHub verified it (a promotion's one commit is the bot's)
      - name: Read the pull request's commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/pulls/$NUMBER/commits?per_page=100" > "$RUNNER_TEMP/commits.json"

      # Through env, never ${{ }} inside run: a branch name is user input
      - name: Check prod's Application
        env:
          BASE: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: PR_COMMITS="$RUNNER_TEMP/commits.json" scripts/check-prod-app.sh "$BASE" "$HEAD_SHA"

      - name: Check what a tag pull request changes
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-tag-pr.sh "$BRANCH" "$BASE" "$HEAD_SHA"
