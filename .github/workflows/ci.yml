name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the GITHUB_TOKEN can only read the repository
permissions:
  contents: read

# On a pull request, a new push cancels the run still going for the old commit.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (version in the comment):
# a tag like v7 can be moved to other code, a commit SHA cannot.

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest -q

  # compose.yaml is the single source of truth for the PostgreSQL image: when
  # Dependabot updates it there, the integration job tests the new version in
  # the same pull request
  postgres-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq is preinstalled on GitHub's Ubuntu runners
      - name: Read the db image from compose.yaml
        id: read
        run: |
          image="$(yq '.services.db.image' compose.yaml)"
          case "$image" in
            postgres:*) ;;
            *) echo "::error::Expected a postgres image in compose.yaml, got '$image'"; exit 1 ;;
          esac
          echo "PostgreSQL image: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Migrations and database constraints against a real PostgreSQL
  integration:
    needs: postgres-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.image }}
        env:
          POSTGRES_USER: haki
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: haki_test
        ports:
          - 5432:5432
        # The job's steps start only once the database accepts connections
        options: >-
          --health-cmd "pg_isready -U haki -d haki_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A throwaway database that exists only for this job: nothing secret here
      DATABASE_URL: postgresql+psycopg://haki:ci-only-password@localhost:5432/haki_test
      TEST_DATABASE_URL: postgresql+psycopg://haki:ci-only-password@localhost:5432/haki_test
      # The app requires 32+ bytes even here
      JWT_SECRET_KEY: ci-only-not-a-secret-just-long-enough
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrate an empty database
        run: alembic upgrade head

      - name: Check that models and migrations match
        run: alembic check

      - name: Downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Integration tests
        run: pytest -m integration -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only; pushing to a registry comes in the next sprint.
      # Layers are cached in the GitHub Actions cache, one scope per image.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: false
          # Into the runner's Docker, so the next step can run the image
          load: true
          tags: haki-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Check Nginx config and auth rate limit
        if: matrix.image == 'frontend'
        run: frontend/scripts/check-rate-limit.sh haki-frontend:ci
