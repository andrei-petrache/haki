name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the GITHUB_TOKEN can only read the repository
permissions:
  contents: read

# On a pull request, a new push cancels the run still going for the old commit.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (version in the comment):
# a tag like v7 can be moved to other code, a commit SHA cannot.

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Fails if a .in file changed without recompiling its lock
      - name: Check that the lock files match the .in files
        run: scripts/compile-requirements.sh --check

      # The lock carries hashes, so pip verifies every file it installs
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest -q

  # compose.yaml is the single source of truth for the PostgreSQL image: when
  # Dependabot updates it there, the integration job tests the new version in
  # the same pull request
  postgres-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq is preinstalled on GitHub's Ubuntu runners
      - name: Read the db image from compose.yaml
        id: read
        run: |
          image="$(yq '.services.db.image' compose.yaml)"
          case "$image" in
            postgres:*) ;;
            *) echo "::error::Expected a postgres image in compose.yaml, got '$image'"; exit 1 ;;
          esac
          echo "PostgreSQL image: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Migrations and database constraints against a real PostgreSQL
  integration:
    needs: postgres-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.image }}
        env:
          POSTGRES_USER: haki
          # Every character that once broke the URL or Alembic: % @ / : #
          POSTGRES_PASSWORD: "ci-only-p%@/:#ss"
          POSTGRES_DB: haki_test
        ports:
          - 5432:5432
        # The job's steps start only once the database accepts connections
        options: >-
          --health-cmd "pg_isready -U haki -d haki_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A throwaway database that exists only for this job: nothing secret here.
      # The app and Alembic get the raw password through the DB_* settings;
      # the tests get the same password percent-encoded in a URL.
      DB_USER: haki
      DB_PASSWORD: "ci-only-p%@/:#ss"
      DB_HOST: localhost
      DB_NAME: haki_test
      TEST_DATABASE_URL: "postgresql+psycopg://haki:ci-only-p%25%40%2F%3A%23ss@localhost:5432/haki_test"
      # The app requires 32+ bytes even here
      JWT_SECRET_KEY: ci-only-not-a-secret-just-long-enough
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Migrate an empty database
        run: alembic upgrade head

      - name: Check that models and migrations match
        run: alembic check

      - name: Downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Integration tests
        run: pytest -m integration -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job may write to the Security tab (the SARIF upload below).
    # Job-level permissions replace the workflow's, so contents: read is
    # repeated here.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read the commit time for the image labels
        id: commit
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      # The only build of this commit's image: the steps and jobs below scan,
      # smoke-test and publish this exact image (build once, deploy many).
      # Layers are cached in the GitHub Actions cache, one scope per image.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: false
          # Into the runner's Docker, so the next step can run the image
          load: true
          tags: haki-${{ matrix.image }}:ci
          # OCI labels: where the image comes from. GHCR also uses "source" to
          # link the package to this repository. The others replace labels
          # inherited from the base image (e.g. nginx's title, url and version),
          # which would describe the wrong image; "created" is the commit time,
          # not the build time, so it does not change between rebuilds.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.commit.outputs.time }}
            org.opencontainers.image.title=haki-${{ matrix.image }}
            org.opencontainers.image.description=Haki ${{ matrix.image }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # The frontend's runtime stage runs apk upgrade: never reuse it from
          # the cache, or the Alpine security fixes would be frozen
          no-cache-filters: ${{ matrix.image == 'frontend' && 'runtime' || '' }}

      - name: Check Nginx config and auth rate limit
        if: matrix.image == 'frontend'
        run: frontend/scripts/check-rate-limit.sh haki-frontend:ci

      # Vulnerability scan of the image just built, run twice: a full report
      # (every severity, no exceptions) for the Security tab, then the gate.
      # The vulnerability database is cached by the action, one key per day.
      - name: Scan ${{ matrix.image }} image (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: haki-${{ matrix.image }}:ci
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      # Only from main: the Security tab tracks the default branch, and the
      # token in Dependabot and fork pull requests cannot write anyway
      - name: Upload the report to the Security tab
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: image-${{ matrix.image }}

      # Fails only on CRITICAL/HIGH vulnerabilities that already have a fix;
      # accepted exceptions (with expiry dates) live in .trivyignore
      - name: Gate on fixable CRITICAL and HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Downloaded by the full report above, in this same job
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
        with:
          version: v0.76.0
          skip-setup-trivy: true
          image-ref: haki-${{ matrix.image }}:ci
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      # Only an image that passed the checks above is handed on, together
      # with its ID, so later jobs can prove they got this exact image
      - name: Save the image for the smoke and publish jobs
        run: |
          mkdir -p image
          docker save "haki-${{ matrix.image }}:ci" | gzip -1 \
            > "image/haki-${{ matrix.image }}.tar.gz"
          # The ID as this Docker sees it, read the same way load-images.sh does
          docker image inspect --format '{{.Id}}' "haki-${{ matrix.image }}:ci" \
            > "image/haki-${{ matrix.image }}.id"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: image/
          retention-days: 1
          compression-level: 0  # already gzipped

  # The whole stack as compose runs it (images, migrations, Nginx, backend,
  # PostgreSQL), smoke-tested through Nginx like a browser would. It runs the
  # images built by the docker job; nothing is rebuilt here.
  smoke:
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: image
          merge-multiple: true

      # compose.yaml names the images haki-<name>:dev; a tag is only a name,
      # the content (image ID) stays the one checked by load-images.sh
      - name: Load the built images
        run: |
          scripts/load-images.sh image
          docker tag haki-backend:ci haki-backend:dev
          docker tag haki-frontend:ci haki-frontend:dev

      # Fresh random values for this run only, masked in the logs. The
      # password deliberately ends in % @ / : # to prove compose passes any
      # password through unescaped (DB_* settings, no URL to build).
      - name: Generate throwaway credentials
        run: |
          db_password="$(openssl rand -hex 16)%@/:#"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          {
            echo "POSTGRES_USER=haki"
            echo "POSTGRES_DB=haki"
            echo "POSTGRES_PASSWORD=$db_password"
            echo "JWT_SECRET_KEY=$jwt_secret"
          } >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Smoke test through Nginx
        run: scripts/smoke-test.sh

      - name: Show the stack's logs
        if: failure()
        run: docker compose logs --no-color

      # The runner is thrown away after the job, so no need to delete volumes
      - name: Stop the stack
        if: always()
        run: docker compose down

  # Publishes the exact images built, scanned and smoke-tested above, without
  # rebuilding them: only on pushes to main, and only after every other job
  # passed. Tags: the full commit SHA (immutable, what a deployment pins) and
  # "main" (moves to the newest commit on main). Never "latest".
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration, docker, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that may write packages; job-level permissions replace
    # the workflow's, so contents: read is repeated here
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: image
          merge-multiple: true

      - name: Load the built images
        run: scripts/load-images.sh image

      # GITHUB_TOKEN, valid only for this run: no personal token to leak
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          echo "| Image | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for name in haki-backend haki-frontend; do
            for tag in "$SHA" main; do
              docker tag "$name:ci" "$REGISTRY/$name:$tag"
              docker push --quiet "$REGISTRY/$name:$tag"
            done
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$name:$SHA")"
            echo "| \`$REGISTRY/$name:$SHA\` | \`${digest#*@}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
